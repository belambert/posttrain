name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # config and CLI tests only; the training deps are too heavy for CI
      - run: uv run --with pytest --with typer --no-project pytest -q
        env:
          PYTHONPATH: src
