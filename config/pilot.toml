# Mid-size run: 50k examples, one epoch. Enough steps for a real loss curve and a
# throughput number to extrapolate the full mixture from. Only the deltas from the
# Tulu 3 recipe are set here — lr, batch size, and sequence length are inherited so
# the numbers transfer to the full run.

out_dir = "runs/pilot"

wandb_project = "posttrain"
run_name = "sft-pilot"

n = 50000
epochs = 1.0

eval_steps = 50
save_steps = 100
logging_steps = 5
